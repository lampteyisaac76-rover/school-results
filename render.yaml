services:
  - type: web
    name: school-results-portal
    runtime: python
    plan: free
    buildCommand: "./build.sh"
    startCommand: "gunicorn config.wsgi:application"
    envVars:
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_USERNAME
        value: "admin"
      - key: ADMIN_PASSWORD
        value: "admin123"
      - key: TEACHER_USERNAME
        value: "teacher"
      - key: TEACHER_PASSWORD
        value: "teacher123"
